[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frameforge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pymysql>=1.1,<2",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "qdrant-client>=1.15,<1.17",
  "minio>=7.2,<8",
  "celery>=5.5,<6",
  "langgraph>=0.4,<2",
  "langchain-core>=0.3,<2",
  "langgraph-checkpoint-redis>=0.0.6,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "Pillow>=11,<13",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
