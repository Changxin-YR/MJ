name: FrameForge CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Configure local test services
        run: cp .env.example .env
      - name: Start stack
        run: docker compose up --build -d
      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head
      - name: Backend tests
        run: docker compose exec -T api pytest -q
      - name: Backend lint and migration check
        run: |
          docker compose exec -T api ruff check app tests scripts
          docker compose exec -T api alembic check
      - name: Frontend build
        run: npm --prefix frontend run build
      - name: Browser end-to-end flow
        run: npm --prefix frontend run e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100 api worker dispatcher
